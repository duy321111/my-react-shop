services:
  mongo:
    image: mongo:7
    container_name: myshop-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
    container_name: myshop-server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      - MONGO_URI=${MONGO_URI_DOCKER:-mongodb://mongo:27017/myreactshop_docker}
      - JWT_SECRET=${JWT_SECRET_DOCKER:-change_this_secret_in_production}
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads
      - ./client/public/img:/client/public/img

  client:
    build:
      context: ./client
    container_name: myshop-client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  mongo-data:
